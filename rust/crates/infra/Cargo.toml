[package]
name = "downloader-infra"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
downloader-domain = { path = "../domain" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time", "sync", "io-util"] }
tokio-util = "0.7"

[dev-dependencies]
tempfile = "3"
