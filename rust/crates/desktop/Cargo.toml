[package]
name = "downloader-desktop"
version = "0.1.0"
edition = "2021"
description = "Interface desktop do Downloader em egui/eframe"
license = "MIT"

[dependencies]
downloader-application = { path = "../application" }
downloader-domain = { path = "../domain" }
eframe = { version = "0.29", default-features = true }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

